[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molood-explorer"
version = "0.2.0"
description = "Explore and create molecular out-of-distribution dataset splits"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.24,<2.0",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "rdkit>=2023.9",
  "matplotlib>=3.7,<4",
  "plotly>=5.18,<7",
  "streamlit>=1.30,<2",
]

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]

[project.scripts]
molood = "molood_explorer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
